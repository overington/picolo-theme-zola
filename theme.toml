name = "picolo"
description = "A minimal, semantic Zola theme built with PicoCSS"
license = "MIT"
homepage = "https://github.com/faizmokh/picolo"
min_version = "0.18.0"
demo = ""

[author]
name = "Faiz Mokhtar"
homepage = ""

[extra]
# PicoCSS settings
pico_cdn_version = "2"
pico_use_cdn = true

# Site metadata
site_author = "Your Name"
site_description = "A minimal blog built with Zola and PicoCSS"

# Navigation
show_nav = true
nav_items = [
    { path = "/", name = "Home" },
    { path = "/blog", name = "Blog" },
    { path = "/about", name = "About" }
]

# Footer
footer_text = "Built with Zola & PicoCSS"

[extra.picolo]
hero_text_color = "default"

# Image resize defaults. Override these under [extra.picolo.image_defaults]
# in the site's zola.toml.
[extra.picolo.image_defaults]
inline_width = 1200
image_fit_max_width = 1600
image_fit_max_height = 1600
hero_width = 1600
hero_height = 720
media_text_width = 1200
media_text_height = 900
