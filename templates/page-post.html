{% extends "page.html" %}

{% block content %}
<article class="container page">
    <header class="page-header">
    <h1>{{ page.title }}</h1>

    {%- if page.description %}
    <div class="page-description">
{{ page.description | markdown | safe }}
    </div>
    {%- endif %}

    {{ <ui.date /> }}
    {{ <ui.reading_time /> }}
    </header>

    <div class="page-content">
{{ page.content | safe }}
    </div>
</article>
{% endblock content %}
